<!DOCTYPE html>
<html>
<head>
    <title>我的第一个网页</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            transition: background-color 0.5s; /* 背景颜色切换时平滑一点 */
            font-family: sans-serif;
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 10px;
            border: none;
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>

    <h1 id="title">现在的状态：平静 ☕</h1>
    <button id="btn">切换心情</button>

    <script>
        const btn = document.getElementById('btn');
        const title = document.getElementById('title');
        let isHappy = false;

        btn.onclick = function() {
            if (isHappy) {
                document.body.style.backgroundColor = 'white';
                title.innerText = '现在的状态：平静 ☕';
                btn.innerText = '切换心情';
            } else {
                document.body.style.backgroundColor = '#FFD700'; // 金色
                title.innerText = '现在的状态：开心！🎉';
                btn.innerText = '点我冷静一下';
            }
            isHappy = !isHappy; // 切换布尔值
        };
    </script>

</body>
</html>
